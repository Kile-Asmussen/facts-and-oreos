[package]
name = "mlua-sys"
version = "0.11.0"
edition = "2024"
links = "lua"
build = "build.rs"

# Mirror all features mlua-sys exposes so mlua's feature activation works
[features]
lua55 = []
lua54 = []
lua53 = []
lua52 = []
lua51 = []
luajit = []
luajit52 = ["luajit"]
luau = []
luau-codegen = []
luau-vector4 = []
vendored = []
external = []
module = []

[dependencies]
flua-mlua-sys = { path = "../flua-mlua-sys" }

[build-dependencies]
flua-src = { path = "../flua-src" }
